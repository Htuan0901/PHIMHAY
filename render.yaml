services:
  - type: web
    name: phimhay
    runtime: node
    buildCommand: npm install && npm install --prefix server && npm install --prefix client --include=dev && npm run build --prefix client
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: VNP_RETURN_URL
        sync: false
